{% extends "base.html" %}

{% block title %}{{ title }} — Soletrak{% endblock %}

{% block head_extra %}
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body text-center">

                <h2 class="mb-3">Completing sign-in…</h2>

                <p class="text-muted mb-4">
                    Finishing your sign-in with Supabase.
                </p>

                <div class="mb-3" data-supabase-oauth-status>
                    <div class="spinner-border" role="status" aria-hidden="true"></div>
                    <span class="visually-hidden">Working…</span>
                </div>

                <div class="alert alert-danger d-none" role="alert" data-supabase-error></div>

                <p class="text-muted small mb-0">
                    If this page does not redirect,
                    <a href="{{ url_for('supabase_auth.supabase_signup') }}">return to sign up</a>.
                </p>

            </div>
        </div>
    </div>
</div>

<script id="supabase-auth-config" type="application/json">{{ supabase_config | tojson }}</script>
<script src="{{ url_for('static', filename='js/supabase_auth_client.js') }}" defer></script>
<script>
    window.addEventListener('DOMContentLoaded', function () {
        if (window.SoletrakSupabaseAuth && typeof window.SoletrakSupabaseAuth.initOAuthCallback === 'function') {
            window.SoletrakSupabaseAuth.initOAuthCallback();
        }
    });
</script>
{% endblock %}
